name: WattScape CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Java 21 / Maven / PostgreSQL Testcontainers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend — Bun / TypeScript / lint / Vitest / Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Scan source hygiene
        run: python3 tools/verify-source-hygiene.py .
      - name: Audit locked dependencies
        run: bun audit --audit-level=low
      - name: Typecheck (app + E2E)
        run: bun run typecheck
      - name: Lint (oxlint, zero errors, warning ratchet)
        run: bun run lint
      - name: Unit and domain tests
        run: bun run test
      - name: Production build
        run: bun run build

  e2e:
    name: Frontend E2E — Playwright (synthetic demo fixtures, no backend)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run E2E
        run: bun run e2e
        env:
          CI: 'true'
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-report
            e2e-results
          retention-days: 7
