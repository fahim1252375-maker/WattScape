termsText=<h2>Local development terms</h2><p>By creating an account in this local WattScape environment, you confirm that you are authorized to use this development instance. Organization access is determined by verified identity and server-side membership. Do not enter production, regulated, or confidential information.</p><h2>Privacy notice</h2><p>This local environment uses your email address and identity-provider subject to authenticate your account and establish organization membership. Account verification and password reset email are handled by the configured local mail service. Production terms and privacy notices must be reviewed and approved by the organization before launch.</p><p>You may decline and stop account creation at any time.</p>
