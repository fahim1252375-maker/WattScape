termsTitle=WattScape Terms and Privacy
termsText=<h2>Local development terms</h2><p>By accepting, you confirm that you are authorized to use this WattScape development environment. Organization data is scoped to the membership associated with your verified identity. Do not enter production, regulated, or confidential information in this local instance.</p><h2>Privacy notice</h2><p>WattScape uses your email address and identity-provider subject to authenticate your account and establish organization membership. The local development environment stores account and organization data in its local PostgreSQL database. Verification and password reset messages are captured by the local Mailpit service and are not delivered externally.</p><p>You may decline and stop account setup at any time. These local notices are for development and must be reviewed and replaced by the organization before production use.</p>
termsPlainText=Local development only. Do not enter production, regulated, or confidential information. Account email and identity subject are used for login and membership. Decline to stop setup.
