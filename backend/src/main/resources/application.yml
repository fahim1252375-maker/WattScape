spring:
  application:
    name: wattscape-api
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wattscape}
    username: ${DATABASE_USERNAME:wattscape}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI:}
          audiences: ${JWT_AUDIENCE:wattscape-api}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
logging:
  level:
    root: INFO
    com.wattscape: INFO
  structured:
    format:
      console: logstash
wattscape:
  security:
    cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    organization-claim: ${JWT_ORGANIZATION_CLAIM:organization_id}
  auth:
    google-enabled: ${GOOGLE_IDP_ENABLED:false}
    apple-enabled: ${APPLE_IDP_ENABLED:false}
  mail:
    from: ${SMTP_FROM:no-reply@wattscape.local}
    app-url: ${APP_PUBLIC_URL:http://localhost:3000}
  

  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
