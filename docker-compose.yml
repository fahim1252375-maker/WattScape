services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    restart: unless-stopped
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wattscape}
      POSTGRES_USER: ${POSTGRES_USER:-wattscape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["wattscape-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wattscape} -d ${POSTGRES_DB:-wattscape}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME in backend/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in backend/.env}
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: "false"
      WATSCAPE_ADMIN_USERNAME: ${WATSCAPE_ADMIN_USERNAME:?Set WATSCAPE_ADMIN_USERNAME in backend/.env}
      WATSCAPE_ADMIN_PASSWORD: ${WATSCAPE_ADMIN_PASSWORD:?Set WATSCAPE_ADMIN_PASSWORD in backend/.env}
      WATSCAPE_MEMBER_USERNAME: ${WATSCAPE_MEMBER_USERNAME:?Set WATSCAPE_MEMBER_USERNAME in backend/.env}
      WATSCAPE_MEMBER_PASSWORD: ${WATSCAPE_MEMBER_PASSWORD:?Set WATSCAPE_MEMBER_PASSWORD in backend/.env}
      WATSCAPE_ORG_ID: ${WATSCAPE_ORG_ID:?Set WATSCAPE_ORG_ID in backend/.env}
      KC_EMAIL_HOST: mailpit
      KC_EMAIL_PORT: ${KC_EMAIL_PORT:-1025}
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - wattscape-keycloak-data:/opt/keycloak/data
      - ./backend/keycloak:/opt/keycloak/data/import:ro
      - ./backend/keycloak/themes:/opt/keycloak/themes:ro
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/wattscape}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-wattscape}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in backend/.env}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Set JWT_ISSUER_URI in backend/.env}
      JWT_JWK_SET_URI: http://keycloak:8080/realms/wattscape-local/protocol/openid-connect/certs
      JWT_AUDIENCE: ${JWT_AUDIENCE:-wattscape-api}
      JWT_ORGANIZATION_CLAIM: ${JWT_ORGANIZATION_CLAIM:-organization_id}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_IDP_ENABLED: ${GOOGLE_IDP_ENABLED:-false}
      APPLE_IDP_ENABLED: ${APPLE_IDP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@wattscape.local}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      PORT: 8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      mailpit: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
volumes:
  wattscape-postgres: {}
  wattscape-keycloak-data: {}
